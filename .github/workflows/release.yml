name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="deployctl-${version}-${goos}-${goarch}"
            binary="${name}"
            if [[ "${goos}" == "windows" ]]; then binary="${binary}.exe"; fi
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${binary}" ./cmd/deployctl
            if [[ "${goos}" == "windows" ]]; then
              zip -j "dist/${name}.zip" "dist/${binary}"
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${binary}"
            fi
            rm "dist/${binary}"
          done
          (cd dist && sha256sum -- *.zip *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: deployctl-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
          fi
